version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: jobs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d jobs_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  migration:
    image: migrate/migrate:v4.16.2
    container_name: migration_runner
    volumes:
      - ./database/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://user:12345678@db:5432/jobs_db?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
    
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: go_backend
    environment:
      DB_HOST: db 
      DB_PORT: 5432
      DB_NAME: jobs_db
      DB_USER: user
      DB_PASSWORD: 12345678
      REMOTIVE_API_URL: https://remotive.com/api/remote-jobs
    ports:
      - "8080:8080"
    depends_on:
      - db
      - migration

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: